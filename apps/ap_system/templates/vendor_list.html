{% extends "base.html" %}
{% block title %}Vendors{% endblock %}
{% block content %}
  <form class="search" method="get">
    <input type="text" name="q" placeholder="Search vendor..." value="{{ query }}">
    <button type="submit">Search</button>
  </form>
  <table>
    <tr><th>Vendor</th><th></th></tr>
    {% for v in vendors %}
    <tr><td><a href="/vendors/{{ v }}">{{ v }}</a></td><td><a href="/vendors/{{ v }}">open &rarr;</a></td></tr>
    {% else %}
    <tr><td colspan="2">No vendors match "{{ query }}".</td></tr>
    {% endfor %}
  </table>
{% endblock %}
